<style>
  /* Plain CSS keyframes — defined outside Tailwind's JIT config so they always
     ship in the stylesheet, even for classes (like .emoji-float) that Tailwind's
     scanner never sees referenced as an "animate-*" utility. */
  @keyframes floatUp {
    0% { transform: translateY(10vh) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: var(--emoji-opacity, 0.22); }
    90% { opacity: var(--emoji-opacity, 0.22); }
    100% { transform: translateY(-115vh) translateX(var(--drift, 40px)) rotate(var(--rot, 25deg)); opacity: 0; }
  }
  @keyframes fadeIn {
    0% { opacity: 0; transform: translateY(6px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  html, body { font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif; font-weight: 500; }
  .font-hand { font-family: 'Indie Flower', cursive; font-weight: 400; }
  .emoji-float {
    position: absolute;
    bottom: -10vh;
    font-size: var(--size, 34px);
    animation: floatUp var(--dur, 22s) linear infinite;
    animation-delay: var(--delay, 0s);
    filter: blur(0.2px);
    user-select: none;
    will-change: transform, opacity;
  }
  .shimmer-bg {
    background: linear-gradient(90deg, rgba(148,163,184,0.15) 25%, rgba(148,163,184,0.35) 37%, rgba(148,163,184,0.15) 63%);
    background-size: 800px 100%;
    animation: shimmer 1.6s linear infinite;
  }
  /* Pequeño "sacudón" cada pocos segundos en los botones principales, para
     llamar la atención sin ser un movimiento constante/molesto. */
  @keyframes btnShake {
    0%, 90% { transform: translateX(0) rotate(0deg); }
    91% { transform: translateX(-3px) rotate(-1.5deg); }
    92% { transform: translateX(3px) rotate(1.5deg); }
    93% { transform: translateX(-3px) rotate(-1.5deg); }
    94% { transform: translateX(3px) rotate(1.5deg); }
    95% { transform: translateX(-2px) rotate(-1deg); }
    96%, 100% { transform: translateX(0) rotate(0deg); }
  }
  .btn-shake { animation: btnShake 3s ease-in-out infinite; }
  .btn-shake:active { animation-play-state: paused; }
  /* Destello que recorre el botón de compartir de vez en cuando. */
  @keyframes btnShine {
    0%, 45% { left: -60%; }
    65%, 100% { left: 130%; }
  }
  .btn-shine::after {
    content: '';
    position: absolute;
    top: 0;
    left: -60%;
    width: 45%;
    height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-18deg);
    animation: btnShine 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  .card-transition { transition: background-color .3s ease, border-color .3s ease, color .3s ease; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.4); border-radius: 999px; }
  .step-enter, .fade-in { animation: fadeIn 0.4s ease-out both; }
  /* Aviso pequeño abajo (p. ej. "copiado al portapapeles") que aparece y
     desaparece solo, sin interrumpir con un alert(). */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(12px);
    opacity: 0;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 50;
    max-width: calc(100vw - 40px);
    text-align: center;
  }
  #toast.toast-visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { opacity: 1; }
  /* iOS Safari hace zoom automático al enfocar un campo con texto menor a

     sigue viéndose con su tamaño normal vía padding/line-height) para que
     tocar un input no dispare ese zoom. */
  input, select, textarea { font-size: 16px !important; }

<script>
(function () {
  "use strict";

  /* ---------------- Theme ---------------- */
  // El tema sigue automáticamente al del dispositivo en cada visita nueva.
  // Si lo alternas a mano con el botón, esa elección se recuerda solo durante
  // esta pestaña (sessionStorage) — la próxima vez que abras la app, vuelve a
  // partir de lo que diga tu sistema, no se queda "pegado" para siempre.
  const root = document.documentElement;
  function applyTheme(mode) {
    if (mode === 'dark') { root.classList.add('dark'); document.getElementById('theme-icon').textContent = '☀️'; }
    else { root.classList.remove('dark'); document.getElementById('theme-icon').textContent = '🌙'; }
  }
  function getInitialTheme() {
    try {
      const saved = sessionStorage.getItem('deacuanto:theme');
      if (saved === 'dark' || saved === 'light') return saved;
    } catch (e) {}
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  let theme = getInitialTheme();
  applyTheme(theme);
  document.getElementById('theme-toggle').addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    applyTheme(theme);
    try { sessionStorage.setItem('deacuanto:theme', theme); } catch (e) {}
  });
  // El botón manual es solo un atajo opcional: si cambias el tema del
  // dispositivo (aunque ya hubieras tocado el botón antes), la app se
  // actualiza sola y en tiempo real, sin depender de él. Además de escuchar
  // el evento "change" (que en iOS a veces no dispara si Safari estaba en
  // segundo plano cuando cambiaste el tema), se vuelve a revisar cada vez
  // que la pestaña vuelve a estar visible, por si el cambio ocurrió mientras
  // no se veía la página.
  function currentSystemTheme() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  let lastKnownSystemTheme = currentSystemTheme();
  function syncToSystemTheme(systemTheme) {
    if (systemTheme === lastKnownSystemTheme) return; // no hubo un cambio real
    lastKnownSystemTheme = systemTheme;
    theme = systemTheme;
    applyTheme(theme);
    try { sessionStorage.removeItem('deacuanto:theme'); } catch (e) {}
  }
  try {
    const mql = window.matchMedia('(prefers-color-scheme: dark)');
    const onSystemChange = (e) => syncToSystemTheme(e.matches ? 'dark' : 'light');
    if (mql.addEventListener) mql.addEventListener('change', onSystemChange);
    else if (mql.addListener) mql.addListener(onSystemChange); // Safari viejo
  } catch (e) {}
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') syncToSystemTheme(currentSystemTheme());
  });
  window.addEventListener('pageshow', () => syncToSystemTheme(currentSystemTheme()));

  /* ---------------- Moneda ---------------- */
  // lang: idioma en el que se muestra TODA la app cuando esa moneda está
  // seleccionada. Las monedas de países hispanohablantes (más el euro) se
  // quedan en español; dólar (US/CA) y libra pasan a inglés; yen a japonés;
  // real brasileño a portugués — el idioma real de cada país/moneda.
  const CURRENCIES = [
    { code: 'MXN', locale: 'es-MX', flag: '🇲🇽', lang: 'es', name: { es: 'Peso mexicano', en: 'Mexican peso', ja: 'メキシコペソ', pt: 'Peso mexicano' } },
    { code: 'USD', locale: 'en-US', flag: '🇺🇸', lang: 'en', name: { es: 'Dólar estadounidense', en: 'US dollar', ja: '米ドル', pt: 'Dólar americano' } },
    { code: 'EUR', locale: 'de-DE', flag: '🇪🇺', lang: 'es', name: { es: 'Euro', en: 'Euro', ja: 'ユーロ', pt: 'Euro' } },
    { code: 'GBP', locale: 'en-GB', flag: '🇬🇧', lang: 'en', name: { es: 'Libra esterlina', en: 'British pound', ja: '英ポンド', pt: 'Libra esterlina' } },
    { code: 'JPY', locale: 'ja-JP', flag: '🇯🇵', lang: 'ja', name: { es: 'Yen japonés', en: 'Japanese yen', ja: '日本円', pt: 'Iene japonês' } },
    { code: 'CAD', locale: 'en-CA', flag: '🇨🇦', lang: 'en', name: { es: 'Dólar canadiense', en: 'Canadian dollar', ja: 'カナダドル', pt: 'Dólar canadense' } },
    { code: 'BRL', locale: 'pt-BR', flag: '🇧🇷', lang: 'pt', name: { es: 'Real brasileño', en: 'Brazilian real', ja: 'ブラジルレアル', pt: 'Real brasileiro' } },
    { code: 'ARS', locale: 'es-AR', flag: '🇦🇷', lang: 'es', name: { es: 'Peso argentino', en: 'Argentine peso', ja: 'アルゼンチンペソ', pt: 'Peso argentino' } },
    { code: 'COP', locale: 'es-CO', flag: '🇨🇴', lang: 'es', name: { es: 'Peso colombiano', en: 'Colombian peso', ja: 'コロンビアペソ', pt: 'Peso colombiano' } },
    { code: 'CLP', locale: 'es-CL', flag: '🇨🇱', lang: 'es', name: { es: 'Peso chileno', en: 'Chilean peso', ja: 'チリペソ', pt: 'Peso chileno' } },
  ];
  function getInitialCurrency() {
    try {
      const saved = localStorage.getItem('deacuanto:currency');
      if (CURRENCIES.some(c => c.code === saved)) return saved;
    } catch (e) {}
    return 'MXN';
  }
  let currency = getInitialCurrency();
  function getCurrency() { return CURRENCIES.find(c => c.code === currency) || CURRENCIES[0]; }
  // Idioma actual de toda la app: lo decide la moneda seleccionada.
  function lang() { return getCurrency().lang || 'es'; }
  function renderCurrencyMenu() {
    const menu = document.getElementById('currency-menu');
    menu.innerHTML = CURRENCIES.map(c => `
      <button data-currency="${c.code}" class="w-full flex items-center gap-2 px-2.5 py-2 rounded-xl text-sm text-left hover:bg-black/5 dark:hover:bg-white/10 transition-colors ${c.code === currency ? 'font-bold text-brand-light-primary dark:text-brand-dark-primary' : ''}">
        <span class="text-base">${c.flag}</span><span class="flex-1 min-w-0 truncate">${c.name[lang()]}</span><span class="text-xs opacity-60">${c.code}</span>
      </button>`).join('');
    menu.querySelectorAll('[data-currency]').forEach(btn => {
      btn.addEventListener('click', () => {
        currency = btn.getAttribute('data-currency');
        try { localStorage.setItem('deacuanto:currency', currency); } catch (e) {}
        document.getElementById('currency-flag').textContent = getCurrency().flag;
        document.getElementById('currency-menu').classList.add('hidden');
        applyStaticTexts();
        renderCurrencyMenu();
        render();
      });
    });
  }
  document.getElementById('currency-flag').textContent = getCurrency().flag;
  renderCurrencyMenu();
  document.getElementById('currency-toggle').addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('currency-menu').classList.toggle('hidden');
  });
  document.addEventListener('click', () => document.getElementById('currency-menu').classList.add('hidden'));
  document.getElementById('currency-menu').addEventListener('click', (e) => e.stopPropagation());

  /* ---------------- Floating emojis ---------------- */

    const drift = (Math.random() * 120 - 60).toFixed(0) + 'px';
    const rot = (Math.random() * 60 - 30).toFixed(0) + 'deg';

    el.style.setProperty('--dur', dur + 's');
    el.style.setProperty('--delay', delay + 's');

  for (let i = 0; i < EMOJI_COUNT; i++) spawnEmoji();

  /* ---------------- State ---------------- */
  // v2: el formato de gastos cambió de "paidBy" (un solo pagador) a "payers"
  // (varios pagadores). Usar una clave nueva evita que datos guardados con el
  // formato viejo (de una sesión de prueba anterior) rompan el render de hoy;
  // normalizeExpense() de abajo además migra cualquier dato viejo que aparezca.
  const STORAGE_KEY = 'deacuanto:state:v2';
  const LEGACY_KEYS = ['deacuanto:state:v1'];
  function defaultState() {
    return {
      step: 0, // 0 = personas, 1 = gastos, 2 = resultados
      people: [], // {id, name}
      expenses: [], // {id, name, amount, payers:[{personId, amount}], participants:[ids]}
    };
  }
  let fallbackIdCounter = Date.now();
  function fallbackId() { return 'id' + (fallbackIdCounter++); }
  // Repara/normaliza un gasto para que siempre tenga la forma actual, sin
  // importar de qué versión de la app venga el dato guardado.
  function normalizeExpense(e, people) {
    if (!e || typeof e !== 'object') e = {};
    const allIds = people.map(p => p.id);
    const participants = Array.isArray(e.participants) && e.participants.length
      ? e.participants.filter(id => allIds.includes(id))
      : allIds.slice();
    let payers = Array.isArray(e.payers) ? e.payers.filter(p => p && allIds.includes(p.personId)) : [];
    if (payers.length === 0 && e.paidBy && allIds.includes(e.paidBy)) {
      // Formato viejo: un solo campo "paidBy" en vez de "payers".
      payers = [{ personId: e.paidBy, amount: e.amount != null ? String(e.amount) : '' }];
    }
    return {
      id: typeof e.id === 'string' ? e.id : fallbackId(),
      name: typeof e.name === 'string' ? e.name : '',
      amount: (typeof e.amount === 'string' || typeof e.amount === 'number') ? String(e.amount) : '',
      payers,
      participants,
    };
  }
  function normalizeState(parsed) {
    const people = Array.isArray(parsed.people)
      ? parsed.people.filter(p => p && typeof p === 'object').map(p => ({
          id: typeof p.id === 'string' ? p.id : fallbackId(),
          name: typeof p.name === 'string' ? p.name : '',
        }))
      : [];
    const expenses = Array.isArray(parsed.expenses) ? parsed.expenses.map(e => normalizeExpense(e, people)) : [];
    const step = [0, 1, 2].includes(parsed.step) ? parsed.step : 0;
    return { step, people, expenses };
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') return normalizeState(parsed);
      }
      // Sin datos en la clave actual: si hay datos de una versión anterior, los migramos.
      for (const legacyKey of LEGACY_KEYS) {
        const legacyRaw = localStorage.getItem(legacyKey);
        if (legacyRaw) {
          const legacyParsed = JSON.parse(legacyRaw);
          if (legacyParsed && typeof legacyParsed === 'object') {
            const migrated = normalizeState(legacyParsed);

  /* ---------------- Helpers ---------------- */
  // Formatea un monto para un <input>: sin decimales si es un número entero
  // (220, no 220.00), y con hasta 2 decimales solo cuando de verdad los tiene.
  function formatAmountInput(n) {

  }
  function fmt(n) {
    const v = Math.round((n + Number.EPSILON) * 100) / 100;

    try {
      return v.toLocaleString(cur.locale, { style: 'currency', currency: cur.code, minimumFractionDigits: 0, maximumFractionDigits: 2 });

  }

  // Normaliza a "tipo oración": la primera letra en mayúscula, el resto tal
  // cual lo escribió la persona (así "pitt" -> "Pitt" pero no se toca algo
  // como "McDonald's" si alguien lo escribe con esa mayúscula a propósito).
  function sentenceCase(str) {

    return trimmed.charAt(0).toUpperCase() + trimmed.slice(1);
  }

  /* ---------------- Progress dots ---------------- */
  function renderProgress() {

        <div class="flex-1">${btnPrimary(t('calculate'), 'expenses-next')}</div>
      </div>
    `;

    if (!hasExpanded) {
      document.getElementById('expense-action-btn').addEventListener('click', () => addExpense(false));
    }
    document.getElementById('expenses-back').addEventListener('click', () => { state.step = 0; saveState(); render(true); });
    document.getElementById('expenses-next').addEventListener('click', onCalculate);

    bindExpenseCardEvents();
  }

  function addExpense(skipRender) {
    // Minimiza los gastos que ya había antes de meter el nuevo, para que la
    // lista no crezca sin control — solo el que estás por llenar se queda
    // abierto.
    state.expenses.forEach(e => collapsedExpenseIds.add(e.id));
    const newExpense = {
      id: uid(),
      name: '',
      amount: '',
      // Sin nada preseleccionado (ni pagador ni participantes): que quede
      // clarísimo que hay que marcarlo a propósito, y no parezca que
      // "ya venía marcado" algo que el usuario no eligió.
      payers: [],
      participants: [],
    };
    state.expenses.push(newExpense);
    saveState();
    renderStepExpenses();
    if (!skipRender) {
      // Lleva la vista directo a la tarjeta nueva, igual que "Calcular" te
      // manda arriba a ver el resultado — aquí te manda abajo a donde vas a
      // seguir escribiendo.
      const el = document.querySelector(`[data-expense-card="${newExpense.id}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function renderExpenseCard(exp, idx) {
    const totalAmt = parseFloat(exp.amount) || 0;

    if (collapsedExpenseIds.has(exp.id)) {
      const nameDisplay = exp.name
        ? escapeHtml(exp.name)
        : `<span class="opacity-60 font-normal">${t('noName')}</span>`;
      return `
        <button type="button" data-expand-expense="${exp.id}" data-expense-card="${exp.id}" class="step-enter w-full text-left rounded-3xl bg-brand-light-card dark:bg-brand-dark-card border border-brand-light-border dark:border-brand-dark-border p-4 shadow-sm flex items-center justify-between gap-3 hover:border-brand-light-primary dark:hover:border-brand-dark-primary transition-colors">
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-sm font-bold uppercase tracking-wide text-brand-light-subtext dark:text-brand-dark-subtext shrink-0">${t('expenseLabel', idx + 1)}</span>
            <span class="text-sm font-semibold truncate">${nameDisplay}</span>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            ${totalAmt > 0 ? `<span class="text-sm font-semibold text-brand-light-primary dark:text-brand-dark-primary">${fmt(totalAmt)}</span>` : ''}
            <span class="text-brand-light-subtext dark:text-brand-dark-subtext text-xs">▾</span>
          </div>
        </button>`;
    }

    const payerChips = state.people.map(p => {
      const checked = exp.payers.some(x => x.personId === p.id);
      return `
        <label class="payer-chip cursor-pointer select-none px-3 py-1.5 rounded-full text-sm font-medium border transition-colors ${checked
          ? 'bg-brand-light-primary dark:bg-brand-dark-primary text-white border-brand-light-primary dark:border-brand-dark-primary'
          : 'bg-transparent text-brand-light-subtext dark:text-brand-dark-subtext border-brand-light-border dark:border-brand-dark-border'}">
          <input type="checkbox" class="hidden payer-checkbox" data-expense-id="${exp.id}" data-person-id="${p.id}" ${checked ? 'checked' : ''} />
          ${escapeHtml(p.name)}
        </label>`;
    }).join('');

    let payerAmountsHtml = '';
    if (exp.payers.length > 1) {
      const sum = exp.payers.reduce((s, x) => s + (parseFloat(x.amount) || 0), 0);
      const diff = Math.round((totalAmt - sum) * 100) / 100;
      const rows = exp.payers.map(x => `
        <div class="flex items-center gap-2">
          <span class="text-sm w-24 truncate">${escapeHtml(personName(x.personId))}</span>
          <input type="number" inputmode="decimal" min="0" step="0.01" data-payer-amount data-expense-id="${exp.id}" data-person-id="${x.personId}" value="${x.amount}" placeholder="ej. 80"
            class="flex-1 min-w-0 rounded-lg border border-brand-light-border dark:border-brand-dark-border bg-transparent px-2.5 py-1.5 text-base focus:outline-none focus:ring-2 focus:ring-brand-light-primary/40 dark:focus:ring-brand-dark-primary/40" />
        </div>`).join('');
      payerAmountsHtml = `
        <div class="mt-2 space-y-1.5 rounded-xl bg-black/[0.03] dark:bg-white/[0.04] p-2.5">
          ${rows}
          <div class="flex items-center justify-between pt-1">
            <button data-split-equal="${exp.id}" class="text-sm font-semibold text-brand-light-primary dark:text-brand-dark-primary hover:underline">${t('splitEqual')}</button>
            <span data-payer-diff="${exp.id}" class="text-sm font-medium ${Math.abs(diff) < 0.01 ? 'text-brand-light-subtext dark:text-brand-dark-subtext' : 'text-rose-500'}">
              ${Math.abs(diff) < 0.01 ? '' : (diff > 0 ? t('missingAssign', fmt(diff)) : t('leftover', fmt(-diff)))}
            </span>
          </div>
        </div>`;
    }

    const participantChips = state.people.map(p => {
      const checked = exp.participants.includes(p.id);
      return `
        <label class="participant-chip cursor-pointer select-none px-3 py-1.5 rounded-full text-sm font-medium border transition-colors ${checked
          ? 'bg-brand-light-primary dark:bg-brand-dark-primary text-white border-brand-light-primary dark:border-brand-dark-primary'
          : 'bg-transparent text-brand-light-subtext dark:text-brand-dark-subtext border-brand-light-border dark:border-brand-dark-border'}">
          <input type="checkbox" class="hidden participant-checkbox" data-expense-id="${exp.id}" data-person-id="${p.id}" ${checked ? 'checked' : ''} />
          ${escapeHtml(p.name)}
        </label>`;
    }).join('');

    return `
      <div class="step-enter rounded-3xl bg-brand-light-card dark:bg-brand-dark-card border border-brand-light-border dark:border-brand-dark-border p-5 shadow-sm relative" data-expense-card="${exp.id}">
        <div class="flex items-center justify-between mb-3 -m-1 p-1 rounded-xl ${state.expenses.length > 1 ? 'cursor-pointer hover:bg-black/[0.03] dark:hover:bg-white/[0.04] transition-colors' : ''}" ${state.expenses.length > 1 ? `data-collapse-expense="${exp.id}" aria-label="${t('minimizeExpenseAria')}"` : ''}>
          <span class="text-sm font-bold uppercase tracking-wide text-brand-light-subtext dark:text-brand-dark-subtext">${t('expenseLabel', idx + 1)}</span>
          ${state.expenses.length > 1 ? `<button data-remove-expense="${exp.id}" class="text-brand-light-subtext dark:text-brand-dark-subtext hover:text-rose-500 transition-colors text-sm" aria-label="${t('removeExpenseAria')}">${t('removeExpense')}</button>` : ''}
        </div>
        <div class="space-y-3">
          <input data-expense-name="${exp.id}" type="text" maxlength="20" value="${escapeHtml(exp.name)}" placeholder="${t('expenseNamePlaceholder')}"
            class="w-full rounded-xl border border-brand-light-border dark:border-brand-dark-border bg-transparent px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-brand-light-primary/40 dark:focus:ring-brand-dark-primary/40" />
          <div>
            <label class="block text-sm text-brand-light-subtext dark:text-brand-dark-subtext mb-1">${t('totalAmountLabel', getCurrency().code)}</label>
            <input data-expense-amount="${exp.id}" type="number" inputmode="decimal" min="0" step="0.01" value="${exp.amount}" placeholder="0"
              class="w-full rounded-xl border border-brand-light-border dark:border-brand-dark-border bg-transparent px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-brand-light-primary/40 dark:focus:ring-brand-dark-primary/40" />
          </div>
          <div>
            <label class="block text-sm text-brand-light-subtext dark:text-brand-dark-subtext mb-1.5">${t('whoPaid')} <span class="font-normal opacity-70">${t('whoPaidHint')}</span></label>
            <div class="flex flex-wrap gap-1.5">
              ${payerChips}
              <button data-toggle-all-payers="${exp.id}" class="cursor-pointer select-none px-3 py-1.5 rounded-full text-sm font-medium border border-dashed border-brand-light-primary/50 dark:border-brand-dark-primary/50 text-brand-light-primary dark:text-brand-dark-primary hover:bg-brand-light-primary/10 dark:hover:bg-brand-dark-primary/15 transition-colors">${t('all')}</button>
            </div>
            ${payerAmountsHtml}
          </div>
          <div>
            <label class="block text-sm text-brand-light-subtext dark:text-brand-dark-subtext mb-1.5">${t('whoSplits')} <span class="font-normal opacity-70">${t('whoSplitsHint')}</span></label>
            <div class="flex flex-wrap gap-1.5">
              ${participantChips}
              <button data-toggle-all-participants="${exp.id}" class="cursor-pointer select-none px-3 py-1.5 rounded-full text-sm font-medium border border-dashed border-brand-light-primary/50 dark:border-brand-dark-primary/50 text-brand-light-primary dark:text-brand-dark-primary hover:bg-brand-light-primary/10 dark:hover:bg-brand-dark-primary/15 transition-colors">${t('all')}</button>
            </div>
          </div>
          <button data-save-expense="${exp.id}" class="w-full rounded-xl bg-brand-light-primary dark:bg-brand-dark-primary hover:bg-brand-light-primaryHover dark:hover:bg-brand-dark-primaryHover text-white font-semibold py-2.5 text-sm transition-colors active:scale-[0.98]">${t('saveExpense')}</button>
        </div>
      </div>
    `;
  }

  function bindExpenseCardEvents() {
    document.querySelectorAll('[data-remove-expense]').forEach(btn => {
      btn.addEventListener('click', (evt) => {
        evt.stopPropagation(); // no debe disparar también el "minimizar" del header
        const eid = btn.getAttribute('data-remove-expense');
        state.expenses = state.expenses.filter(e => e.id !== eid);
        collapsedExpenseIds.delete(eid);
        saveState();
        renderStepExpenses();
      });
    });
    document.querySelectorAll('[data-expand-expense]').forEach(btn => {
      btn.addEventListener('click', () => {
        const eid = btn.getAttribute('data-expand-expense');
        // Solo un gasto abierto a la vez: al abrir este, se minimizan todos
        // los demás para no terminar con varios abiertos al mismo tiempo.
        state.expenses.forEach(e => { if (e.id !== eid) collapsedExpenseIds.add(e.id); });
        collapsedExpenseIds.delete(eid);
        renderStepExpenses();
      });
    });
    document.querySelectorAll('[data-collapse-expense]').forEach(btn => {
      btn.addEventListener('click', () => {
        collapsedExpenseIds.add(btn.getAttribute('data-collapse-expense'));
        renderStepExpenses();
      });
    });
    document.querySelectorAll('[data-save-expense]').forEach(btn => {
      btn.addEventListener('click', (evt) => {
        evt.stopPropagation();
        const eid = btn.getAttribute('data-save-expense');
        const exp = state.expenses.find(e => e.id === eid);
        if (!exp) return;
        const errorEl = document.getElementById('expenses-error');
        errorEl.classList.add('hidden');
        if (!validateExpense(exp, errorEl)) return; // se queda abierto para corregirlo
        collapsedExpenseIds.add(eid);
        saveState();
        renderStepExpenses();
      });
    });
    document.querySelectorAll('[data-expense-name]').forEach(inp => {
      inp.addEventListener('input', () => {
        const eid = inp.getAttribute('data-expense-name');
        const exp = state.expenses.find(e => e.id === eid);
        if (inp.value.length > 20) inp.value = inp.value.slice(0, 20);
        if (exp) exp.name = inp.value;
        saveState();
      });
      inp.addEventListener('blur', () => {
        const eid = inp.getAttribute('data-expense-name');
        const exp = state.expenses.find(e => e.id === eid);
        if (!exp) return;
        const normalized = sentenceCase(exp.name);
        if (normalized !== exp.name) {
          exp.name = normalized;
          inp.value = normalized;
          saveState();
        }
      });
    });
    document.querySelectorAll('[data-expense-amount]').forEach(inp => {
      inp.addEventListener('input', () => {
        const eid = inp.getAttribute('data-expense-amount');
        const exp = state.expenses.find(e => e.id === eid);
        if (!exp) return;
        exp.amount = inp.value;
        if (exp.payers.length === 1) {
          // Con un solo pagador, su monto siempre coincide con el total.
          exp.payers[0].amount = inp.value;
        } else if (exp.payers.length > 1) {
          // Si el total cambia, los montos que ya estaban escritos podrían
          // dejar de cuadrar (son de cuando el total era otro). Para que
          // nunca se quede un número "viejo" que ya no corresponde, se
          // reinician a partes iguales del nuevo total.
          splitPayersEqually(exp);
        }
        saveState();
        syncPayerAmountInputs(exp, null);
        updatePayerDiff(eid);
      });
    });
    document.querySelectorAll('.payer-checkbox').forEach(chk => {
      chk.addEventListener('change', () => {
        const eid = chk.getAttribute('data-expense-id');
        const pid = chk.getAttribute('data-person-id');
        const exp = state.expenses.find(e => e.id === eid);
        if (!exp) return;
        const prevCount = exp.payers.length;
        if (chk.checked) {
          if (!exp.payers.some(x => x.personId === pid)) exp.payers.push({ personId: pid, amount: '' });
        } else {
          exp.payers = exp.payers.filter(x => x.personId !== pid);
        }
        if (exp.payers.length === 1) {
          exp.payers[0].amount = exp.amount;
          exp.payers[0].auto = false;
        } else if (exp.payers.length > 1 && prevCount <= 1) {
          // Se acaba de pasar de un solo pagador a varios: si dejamos el monto
          // completo "pegado" a esa persona, el cálculo automático del resto
          // ya no puede saber cuánto falta. Se limpia para que, en cuanto
          // escribas cuánto puso alguien, el resto se calcule solo.
          exp.payers.forEach(p => { p.amount = ''; p.auto = false; });
        } else if (exp.payers.length > 1) {
          // Se agregó o quitó un pagador mientras ya había otros con monto:
          // si alguno estaba marcado como "el resto", se recalcula de inmediato.
          recalcAutoPayer(exp);
        }
        saveState();
        renderStepExpenses();
      });
    });
    document.querySelectorAll('[data-payer-amount]').forEach(inp => {
      inp.addEventListener('input', () => {
        const eid = inp.getAttribute('data-expense-id');
        const pid = inp.getAttribute('data-person-id');
        const exp = state.expenses.find(e => e.id === eid);
        if (!exp) return;
        const payer = exp.payers.find(x => x.personId === pid);
        if (payer) payer.amount = inp.value;
        autoFillPayerAmounts(exp, pid);
        saveState();
        syncPayerAmountInputs(exp, pid);
        updatePayerDiff(eid);
      });
    });
    document.querySelectorAll('[data-split-equal]').forEach(btn => {
      btn.addEventListener('click', () => {
        const eid = btn.getAttribute('data-split-equal');
        const exp = state.expenses.find(e => e.id === eid);
        if (!exp || exp.payers.length === 0) return;
        splitPayersEqually(exp);
        saveState();
        renderStepExpenses();
      });
    });
    document.querySelectorAll('[data-toggle-all-participants]').forEach(btn => {
      btn.addEventListener('click', () => {
        const eid = btn.getAttribute('data-toggle-all-participants');
        const exp = state.expenses.find(e => e.id === eid);
        if (!exp) return;
        // "Todos" alterna: si ya estaban todos marcados, los desmarca a
        // todos de un tap; si no, los marca a todos.
        const allSelected = state.people.length > 0 && state.people.every(p => exp.participants.includes(p.id));
        exp.participants = allSelected ? [] : state.people.map(p => p.id);
        saveState();
        renderStepExpenses();
      });
    });
    document.querySelectorAll('[data-toggle-all-payers]').forEach(btn => {
      btn.addEventListener('click', () => {
        const eid = btn.getAttribute('data-toggle-all-payers');
        const exp = state.expenses.find(e => e.id === eid);
        if (!exp) return;
        const allSelected = state.people.length > 0 && state.people.every(p => exp.payers.some(x => x.personId === p.id));
        if (allSelected) {
          exp.payers = [];
        } else if (state.people.length === 1) {
          exp.payers = [{ personId: state.people[0].id, amount: exp.amount, auto: false }];
        } else {
          // Con varios pagadores se deja el monto en blanco (igual que al
          // marcarlos uno por uno) para que el cálculo automático del resto
          // pueda hacer su trabajo en cuanto se escriba algo.
          exp.payers = state.people.map(p => ({ personId: p.id, amount: '', auto: false }));
        }
        saveState();
        renderStepExpenses();
      });
    });
    document.querySelectorAll('.participant-checkbox').forEach(chk => {
      chk.addEventListener('change', () => {
        const eid = chk.getAttribute('data-expense-id');
        const pid = chk.getAttribute('data-person-id');
        const exp = state.expenses.find(e => e.id === eid);
        if (!exp) return;
        if (chk.checked) {
          if (!exp.participants.includes(pid)) exp.participants.push(pid);
        } else {
          exp.participants = exp.participants.filter(id => id !== pid);
        }
        saveState();
        // Reconstruye el paso completo en vez de solo alternar clases CSS a mano:
        // así el estado (checked, texto, colores) nunca se puede desincronizar.
        renderStepExpenses();
      });
    });
  }

  function splitPayersEqually(exp) {
    const total = parseFloat(exp.amount) || 0;
    const n = exp.payers.length;
    if (n === 0) return;
    const base = Math.floor((total / n) * 100) / 100;
    let assigned = 0;
    exp.payers.forEach((pay, i) => {
      pay.auto = false; // partes iguales es una asignación explícita, no "el resto"
      if (i < n - 1) { pay.amount = formatAmountInput(base); assigned += base; }
      else { pay.amount = formatAmountInput(total - assigned); }
    });
  }

  // Recalcula el monto del pagador marcado como "automático" (si hay uno) a
  // partir del total menos lo que ya tienen los demás.
  function recalcAutoPayer(exp) {
    const autoPayer = exp.payers.find(p => p.auto);
    if (!autoPayer) return;
    const total = parseFloat(exp.amount) || 0;
    const sumOthers = exp.payers.reduce((s, p) => (p === autoPayer ? s : s + (parseFloat(p.amount) || 0)), 0);
    const remainder = Math.round((total - sumOthers) * 100) / 100;
    autoPayer.amount = remainder >= 0 ? formatAmountInput(remainder) : '0';
  }

  // Si de N pagadores solo queda uno sin monto, ese se vuelve "el automático"
  // y se recalcula con cada tecla que escribas en los demás — no solo la
  // primera vez, para que no se quede "congelado" al ir corrigiendo un monto.
  function autoFillPayerAmounts(exp, editedPid) {
    if (exp.payers.length < 2) return;
    const edited = exp.payers.find(p => p.personId === editedPid);
    if (!edited) return;

    // Si el usuario escribe directamente sobre el campo que era "el
    // automático", deja de serlo: ahora es un valor puesto a mano.
    if (edited.auto) edited.auto = false;

    let autoPayer = exp.payers.find(p => p.auto && p.personId !== editedPid);
    if (!autoPayer) {
      const others = exp.payers.filter(p => p.personId !== editedPid);
      const blanks = others.filter(p => p.amount === '' || p.amount === null || p.amount === undefined);
      if (blanks.length === 1) {
        autoPayer = blanks[0];
        autoPayer.auto = true;
      }
    }
    recalcAutoPayer(exp);
  }

  function syncPayerAmountInputs(exp, editedPid) {
    exp.payers.forEach(p => {
      if (p.personId === editedPid) return;
      const el = document.querySelector(`[data-payer-amount][data-expense-id="${exp.id}"][data-person-id="${p.personId}"]`);
      if (el && el.value !== p.amount) el.value = p.amount;
    });
  }

  function updatePayerDiff(expenseId) {
    const exp = state.expenses.find(e => e.id === expenseId);
    if (!exp || exp.payers.length <= 1) return;
    const span = document.querySelector(`[data-payer-diff="${expenseId}"]`);
    if (!span) return;
    const total = parseFloat(exp.amount) || 0;
    const sum = exp.payers.reduce((s, x) => s + (parseFloat(x.amount) || 0), 0);
    const diff = Math.round((total - sum) * 100) / 100;
    const ok = Math.abs(diff) < 0.01;
    span.textContent = ok ? '' : (diff > 0 ? t('missingAssignShort', fmt(diff)) : t('leftover', fmt(-diff)));
    span.classList.toggle('text-rose-500', !ok);
  }

  // Valida un solo gasto (nombre, monto, pagadores, participantes) y, si
  // algo falta, lo escribe en errorEl y devuelve false. La usan tanto
  // "Guardar gasto" (un gasto a la vez) como "Calcular" (todos juntos).
  function validateExpense(exp, errorEl) {
    exp.name = sentenceCase(exp.name);
    const amt = parseFloat(exp.amount);
    if (!exp.name) { errorEl.textContent = t('errAllExpenseNames'); errorEl.classList.remove('hidden'); return false; }
    if (!amt || amt <= 0) { errorEl.textContent = t('errAmount', exp.name); errorEl.classList.remove('hidden'); return false; }
    if (!exp.payers || exp.payers.length === 0) { errorEl.textContent = t('errWhoPaid', exp.name); errorEl.classList.remove('hidden'); return false; }
    if (exp.payers.length === 1) {
      exp.payers[0].amount = exp.amount;
    } else {
      const sum = exp.payers.reduce((s, x) => s + (parseFloat(x.amount) || 0), 0);
      if (Math.abs(sum - amt) > 0.01) {
        errorEl.textContent = t('errSum', exp.name, fmt(amt));
        errorEl.classList.remove('hidden');
        return false;
      }
    }
    if (!exp.participants || exp.participants.length === 0) { errorEl.textContent = t('errParticipants', exp.name); errorEl.classList.remove('hidden'); return false; }
    return true;
  }

  function onCalculate() {
    const errorEl = document.getElementById('expenses-error');
    for (const exp of state.expenses) {
      if (!validateExpense(exp, errorEl)) return;
    }
    saveState();
    state.step = 2;
    saveState();
    render(true);
  }

  /* ---------------- Cálculo de deudas ---------------- */
  function computeSettlement() {
    const balances = {};
    state.people.forEach(p => balances[p.id] = 0);

    state.expenses.forEach(exp => {
      const amt = parseFloat(exp.amount) || 0;
      const n = exp.participants.length || 1;
      const share = amt / n;
      exp.payers.forEach(pay => {
        if (balances[pay.personId] !== undefined) balances[pay.personId] += (parseFloat(pay.amount) || 0);
      });
      exp.participants.forEach(pid => {
        if (balances[pid] !== undefined) balances[pid] -= share;
      });
    });

    const EPS = 0.005;
    const creditors = [];
    const debtors = [];
    Object.entries(balances).forEach(([id, bal]) => {
      const rounded = Math.round(bal * 100) / 100;
      if (rounded > EPS) creditors.push({ id, amount: rounded });
      else if (rounded < -EPS) debtors.push({ id, amount: -rounded });
    });
    creditors.sort((a, b) => b.amount - a.amount);
    debtors.sort((a, b) => b.amount - a.amount);

    const transactions = [];
    let ci = 0, di = 0;
    while (ci < creditors.length && di < debtors.length) {
      const c = creditors[ci];
      const d = debtors[di];
      const pay = Math.min(c.amount, d.amount);
      if (pay > EPS) {
        transactions.push({ from: d.id, to: c.id, amount: Math.round(pay * 100) / 100 });
      }
      c.amount -= pay;
      d.amount -= pay;
      if (c.amount <= EPS) ci++;
      if (d.amount <= EPS) di++;
    }

    return { balances, transactions };
  }

  /* ---------------- Compartir resultado ---------------- */
  function buildShareText(total, transactions) {
    const lines = ['🤑 *¿De A Cuánto?*', t('shareTotal', fmt(total)), ''];
    if (transactions.length > 0) {
      transactions.forEach(tx => {
        lines.push(`💸 *${personName(tx.from)}* ${t('paysTo')} *${personName(tx.to)}*: ${fmt(tx.amount)}`);
      });
    } else {
      lines.push(`🎉 *${t('allEvenPlain')}*`);
    }
    lines.push('', t('calculatedWith'));
    return lines.join('\n');
  }
  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.remove('hidden');
    requestAnimationFrame(() => el.classList.add('toast-visible'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.classList.remove('toast-visible');
      setTimeout(() => el.classList.add('hidden'), 300);
    }, 2600);
  }

  /* ---------------- Step 2: Resultados ---------------- */
  function renderStepResults() {
    const container = document.getElementById('step-content');
    const { balances, transactions } = computeSettlement();
    const total = state.expenses.reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);

    const balanceRows = state.people.map(p => {
      const b = Math.round((balances[p.id] || 0) * 100) / 100;
      const isPos = b > 0.005;
      const isNeg = b < -0.005;
      const color = isPos ? 'text-brand-light-primary dark:text-brand-dark-primary' : isNeg ? 'text-rose-500' : 'text-brand-light-subtext dark:text-brand-dark-subtext';
      const label = isPos ? t('isOwed', fmt(b)) : isNeg ? t('owes', fmt(-b)) : t('isEven');
      return `<div class="flex items-center justify-between py-2 border-b border-brand-light-border dark:border-brand-dark-border last:border-0">
        <span class="font-medium text-sm">${escapeHtml(p.name)}</span>
        <span class="text-sm font-semibold ${color}">${label}</span>
      </div>`;
    }).join('');

    const settlementRows = transactions.length > 0
      ? transactions.map(tx => `
        <div class="step-enter flex items-center gap-3 rounded-2xl border border-brand-light-border dark:border-brand-dark-border p-3.5">
          <span class="text-xl">💸</span>
          <div class="flex-1 min-w-0 text-sm">
            <span class="font-semibold">${escapeHtml(personName(tx.from))}</span>
            <span class="text-brand-light-subtext dark:text-brand-dark-subtext"> ${t('paysTo')} </span>
            <span class="font-semibold">${escapeHtml(personName(tx.to))}</span>
          </div>
          <span class="font-bold text-brand-light-primary dark:text-brand-dark-primary">${fmt(tx.amount)}</span>
        </div>
      `).join('')
      : `<div class="text-center py-6 text-sm text-brand-light-subtext dark:text-brand-dark-subtext">🎉 ${t('allEvenPlain')}</div>`;

    container.innerHTML = `
      <div class="step-enter rounded-3xl bg-brand-light-card dark:bg-brand-dark-card border border-brand-light-border dark:border-brand-dark-border p-5 shadow-sm mb-4">
        <div class="flex items-center justify-between mb-1">
          <h2 class="text-lg font-bold">${t('resultTitle')}</h2>
          <span class="text-sm font-semibold px-2.5 py-1 rounded-full bg-brand-light-primary/10 dark:bg-brand-dark-primary/15 text-brand-light-primary dark:text-brand-dark-primary">${t('totalLabel', fmt(total))}</span>
        </div>
        <p class="text-sm text-brand-light-subtext dark:text-brand-dark-subtext mb-3">${t('resultSubtitle')}</p>
        <div class="space-y-2.5 mb-1">${settlementRows}</div>
      </div>

      <details class="step-enter rounded-3xl bg-brand-light-card dark:bg-brand-dark-card border border-brand-light-border dark:border-brand-dark-border p-5 shadow-sm mb-4">
        <summary class="cursor-pointer text-sm font-semibold text-brand-light-subtext dark:text-brand-dark-subtext">${t('viewBalance')}</summary>
        <div class="mt-3">${balanceRows}</div>
      </details>

      <div class="mb-2">${btnPrimary(t('shareResult'), 'results-share', null, 'shine')}</div>
      <div class="flex gap-2">
        <button id="results-back" class="w-1/2 rounded-xl border border-brand-light-border dark:border-brand-dark-border text-brand-light-subtext dark:text-brand-dark-subtext font-semibold py-3 hover:bg-black/5 dark:hover:bg-white/5 transition-colors">${t('editExpenses')}</button>
        <button id="results-restart" class="btn-shake w-1/2 rounded-xl border border-rose-300 dark:border-rose-900 bg-rose-500/5 text-rose-500 font-semibold py-3 hover:bg-rose-500/10 active:scale-[0.98] transition-colors">${t('startOver')}</button>
      </div>
    `;

    document.getElementById('results-share').addEventListener('click', async () => {
      const text = buildShareText(total, transactions);
      // navigator.share abre el menú nativo de compartir del sistema, para
      // que tú elijas WhatsApp, Telegram, mensajes, lo que sea — es lo mejor
      // en celular. Si el navegador no lo soporta (la mayoría de escritorio),
      // se copia el texto al portapapeles como respaldo.
      if (navigator.share) {
        try {
          await navigator.share({ title: '¿De A Cuánto?', text });
        } catch (err) {
          // El usuario canceló el share o falló silenciosamente: no hacer nada.
        }
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        showToast(t('toastCopied'));
      } catch (err) {
        showToast(t('toastCopyFail'));
      }
    });
    document.getElementById('results-back').addEventListener('click', () => { state.step = 1; saveState(); render(true); });
    document.getElementById('results-restart').addEventListener('click', () => {
      if (confirm(t('confirmRestart'))) {
        state = defaultState();
        saveState();
        render(true);
      }
    });
  }

  /* ---------------- Utils ---------------- */
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ---------------- Router ---------------- */
  // scrollToTop: solo se pide true al cambiar de paso (Continuar, Calcular,
  // Atrás...) para que el resultado quede a la vista de inmediato — no se usa
  // en refrescos dentro del mismo paso (como cambiar de moneda) para no
  // interrumpir al usuario mientras edita.
  function render(scrollToTop) {
    try {
      renderProgress();
      if (state.step === 0) renderStepPeople();
      else if (state.step === 1) renderStepExpenses();
      else renderStepResults();
      if (scrollToTop) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    } catch (err) {
      // Red de seguridad: si algo truena al dibujar la pantalla, mostramos un
      // mensaje recuperable en vez de dejar la página en blanco.
      console.error('Error al mostrar la app:', err);
      const container = document.getElementById('step-content');
      if (container) {
        container.innerHTML = card(`
          <h2 class="text-lg font-bold mb-1">${t('errorTitle')}</h2>
          <p class="text-sm text-brand-light-subtext dark:text-brand-dark-subtext mb-4">${t('errorBody')}</p>
          ${btnPrimary(t('startOver'), 'render-error-restart')}
        `);
        const btn = document.getElementById('render-error-restart');
        if (btn) btn.addEventListener('click', () => {
          state = defaultState();
          saveState();
          render();
        });
      }
    }
  }

  /* ---------------- Retomar un cálculo guardado ---------------- */
  // localStorage no tiene fecha de caducidad: si dejaste algo a medias (o
  // incluso ya terminado, sin darle a "Empezar de nuevo") hace un rato o
  // hace semanas, seguía apareciendo solo con abrir la página, sin avisar.
  // Ahora, si hay datos guardados de una visita anterior, se pregunta antes
  // de mostrar nada — así nunca aparecen nombres "misteriosos" que ni
  // pediste, ni se pierde por accidente algo que sí ibas a continuar.
  function renderResumePrompt() {
    document.getElementById('progress').innerHTML = '';
    const container = document.getElementById('step-content');
    const n = state.people.length;
    container.innerHTML = card(`
      <h2 class="text-lg font-bold mb-1">${t('resumeTitle')}</h2>
      <p class="text-sm text-brand-light-subtext dark:text-brand-dark-subtext mb-4">${t('resumeBody', n)}</p>
      <div class="flex gap-2">
        <button id="resume-new" class="w-1/2 rounded-xl border border-rose-300 dark:border-rose-900 bg-rose-500/5 text-rose-500 font-semibold py-3 hover:bg-rose-500/10 active:scale-[0.98] transition-colors">${t('startNew')}</button>
        <div class="w-1/2">${btnPrimary(t('continueBtn'), 'resume-continue')}</div>
      </div>
    `);
    document.getElementById('resume-new').addEventListener('click', () => {
      state = defaultState();
      saveState();
      render(true);
    });
    document.getElementById('resume-continue').addEventListener('click', () => {
      render(true);
    });
  }

  /* ---------------- Boot ---------------- */
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      document.getElementById('skeleton').style.display = 'none';
      const app = document.getElementById('app');
      app.classList.remove('hidden');
      app.classList.add('flex');
      if (state.people.length > 0) {
        renderResumePrompt();
      } else {
        render();
      }
    }, 850);
  });
})();
</script>
</body>
</html>
